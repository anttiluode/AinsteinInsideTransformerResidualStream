name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install torch
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile gate05_jspace_readout.py gate05_strategy_invariance.py gate06_causal_route_steering.py gate07_numeric_first_action.py gate07b_numeric_trajectory.py gate1_depth_trace.py
